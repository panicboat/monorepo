---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pennyworth
  namespace: flux-system
spec:
  interval: 5m0s
  path: "./system-components/pennyworth/kubernetes/overlays/production"
  prune: true
  sourceRef:
    kind: GitRepository
    name: monorepo
  targetNamespace: system-components
  postBuild:
    substitute:
      service_name: pennyworth
