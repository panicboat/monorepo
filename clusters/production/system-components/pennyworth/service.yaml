apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: monorepo-pennyworth
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/panicboat/monorepo.git
  ref:
    tag: pennyworth-v1.2.1 # {"$imagepolicy": "flux-system:pennyworth:tag"}
  provider: github
  secretRef:
    name: panicboat-github-app
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pennyworth
  namespace: flux-system
spec:
  interval: 5m0s
  path: "./system-components/pennyworth/kubernetes/overlays/production"
  prune: true
  sourceRef:
    kind: GitRepository
    name: monorepo-pennyworth
  targetNamespace: system-components
  postBuild:
    substitute:
      service_name: pennyworth
