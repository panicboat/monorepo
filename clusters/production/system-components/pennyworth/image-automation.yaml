apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: pennyworth
  namespace: flux-system
spec:
  interval: 30m
  sourceRef:
    kind: GitRepository
    name: monorepo
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: panicboat@gmail.com
        name: panicboat
      messageTemplate: |
        chore(pennyworth): deploy {{range .Changed.Changes}}{{ println .NewValue }}{{end}}
    push:
      branch: main
  update:
    path: ./clusters/production/system-components/pennyworth
    strategy: Setters
