apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: pennyworth
  namespace: flux-system
  labels:
    service: pennyworth
spec:
  imageRepositoryRef:
    name: pennyworth
  filterTags:
    pattern: '^v(?P<version>\d+\.\d+\.\d+)$'
    extract: '$version'
  policy:
    semver:
      range: '>=0.0.0'
