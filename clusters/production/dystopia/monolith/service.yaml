---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monolith
  namespace: flux-system
spec:
  interval: 5m0s
  path: "./dystopia/monolith/kubernetes/overlays/production"
  prune: true
  sourceRef:
    kind: GitRepository
    name: monorepo
  targetNamespace: dystopia
  postBuild:
    substitute:
      service_name: monolith
