---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: meeting-translation
  namespace: flux-system
spec:
  interval: 5m0s
  path: "./tools/meeting-translation/kubernetes/overlays/production"
  prune: true
  sourceRef:
    kind: GitRepository
    name: monorepo
  targetNamespace: tools
  postBuild:
    substitute:
      service_name: meeting-translation
