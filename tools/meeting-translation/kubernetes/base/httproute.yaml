# Cilium Gateway (= namespace default、 listener http:8080) を parentRef、
# host dystopia.city の /translate prefix を meeting-translation Service:80
# に backend する。 ingress 経路: client → ALB (= application IngressGroup、
# platform 側 kubernetes/components/cilium/) → cilium-envoy hostNetwork
# :8080 → 本 HTTPRoute → meeting-translation。
#
# metadata.namespace / backendRefs[].namespace は指定しない。 前者は Flux
# Kustomization.spec.targetNamespace (= tools) が inject、 後者は同一
# namespace 参照 (= tools/meeting-translation Service) にして cross-namespace
# 参照の ReferenceGrant 要件を回避する。 parentRefs は Gateway が存在する
# default を明示する必要があるので残す (= allowedRoutes.namespaces.from: All
# のため tools namespace からの参照も許可されている)。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: meeting-translation
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: default
  hostnames:
    - dystopia.city
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /translate
      backendRefs:
        - name: meeting-translation
          port: 80
