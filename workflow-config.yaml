stacks:
  - name: container
    paths:
      - "dystopia/{service}"
      - "system-components/{service}"

  - name: terragrunt
    id: aws
    paths:
      - "dystopia/{service}/aws/{environment}"
      - "system-components/{service}/infrastructure/aws/{environment}"
    environments:
      production:
        aws_region: ap-northeast-1
        iam_role_plan: arn:aws:iam::337169763788:role/github-oidc-auth-production-github-actions-plan-role
        iam_role_apply: arn:aws:iam::337169763788:role/github-oidc-auth-production-github-actions-apply-role
    exclude:
      # eks-production teardown中のため無効化 (Renovate PRのCI auto-applyでdestroy済stackへの再作成を防ぐ、panicboat/platform docs/runbooks/eks-production-recreate.md 参照)
      - environment: production

  - name: kubernetes
    paths:
      - "dystopia/{service}/kubernetes/overlays/{environment}"
      - "system-components/{service}/kubernetes/overlays/{environment}"
    environments:
      production: {}
    exclude:
      # eks-production teardown中のため無効化 (Renovate PRのCI auto-applyでdestroy済stackへの再作成を防ぐ、panicboat/platform docs/runbooks/eks-production-recreate.md 参照)
      - environment: production
