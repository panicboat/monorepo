# Judges with Gemini on Vertex AI whether a pull request keeps the dystopia docs in sync and reports the verdict as the Docs Sync Check commit status.
name: 'Docs Sync Check'

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions: {}

concurrency:
  # Runs that decide.sh ignores get their own group, so they cannot cancel a judge in progress and leave its status pending.
  group: >-
    ${{
      (
        ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'docs-check-approved')
        || (github.event.action == 'edited' && !github.event.changes.body && !github.event.changes.base)
        || ((github.event.action == 'edited' || github.event.action == 'reopened') && contains(github.event.pull_request.labels.*.name, 'docs-check-approved'))
      )
      && format('docs-sync-check-ignored-{0}', github.run_id)
      || format('docs-sync-check-{0}', github.event.pull_request.number)
    }}
  cancel-in-progress: true

jobs:
  docs-sync-check:
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      id-token: write
    uses: panicboat/.github/.github/workflows/reusable--docs-sync-check.yaml@89b90f6bb492d099554e417307785244925fbf9b # feat/gemini-on-vertex
    with:
      scope-pattern: '^dystopia/'
      prompt-path: .github/prompts/docs-sync-check.md
