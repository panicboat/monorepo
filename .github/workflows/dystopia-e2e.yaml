name: 'Dystopia E2E'

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  e2e:
    name: 'E2E'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: dystopia/e2e
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Ruby
        uses: ruby/setup-ruby@20eb24b0d509e2b9ed9b6d42ddfeb992915e0564 # v1.341.0
        with:
          ruby-version: 4.0.10
          working-directory: dystopia/monolith
          bundler-cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: dystopia/e2e/package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1

      - name: Install e2e dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec e2e-web install chromium --with-deps

      # The preinstalled psql 16 fails on \list against PostgreSQL 18, which hanami db uses to check that a database exists.
      - name: Install PostgreSQL 18 client
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          # pg_wrapper would pick the preinstalled 16 cluster's version, so the 18 binaries go first on PATH.
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"

      - name: Start the stack
        timeout-minutes: 15
        run: bin/stack up

      # Stays below the job timeout so a hang still leaves time for the artifact upload.
      - name: Run e2e
        timeout-minutes: 45
        run: pnpm exec e2e run --reporter list,junit
        env:
          CI: '1'
          E2E_TELEMETRY_DISABLED: '1'
          APP_URL: http://localhost:3055

      - name: Upload report and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dystopia-e2e
          path: |
            dystopia/e2e/.e2e/report.json
            dystopia/e2e/.e2e/junit.xml
            dystopia/e2e/.e2e/results/
            dystopia/e2e/.e2e/stack/
          # The report directory is hidden, and hidden files are excluded by default.
          include-hidden-files: true
          retention-days: 7
