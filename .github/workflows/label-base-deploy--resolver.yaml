# Resolves deploy labels into targets, then plans, builds, or diffs them on pull requests and applies or builds them on push to main.
name: 'Label Base Deploy - Resolver'

on:
  pull_request:
    types: [labeled]
    branches:
      - '**'
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  packages: write
  pull-requests: write

concurrency:
  group: label-base-deploy-resolver-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve:
    name: 'Resolve Targets'
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.resolver.outputs.targets }}
      has-targets: ${{ steps.resolver.outputs.has-targets }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Get PR information
        id: pr-info
        uses: jwalton/gh-find-current-pr@f3d61b485d2801773f7a07b2aaa3306bd8f8e653 # v1.3.5
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          state: all
        continue-on-error: true

      - name: Label Resolver
        id: resolver
        uses: panicboat/deploy-actions/label-resolver@1ab520e5ef33b8d744982762ffc4e08009a34744 # v2.0.1
        with:
          repository: ${{ github.repository }}
          pr-number: ${{ steps.pr-info.outputs.number }}
          github-token: ${{ steps.app-token.outputs.token }}
          config-path: 'workflow-config.yaml'

  deploy-terragrunt:
    name: 'Deploy Terragrunt (${{ matrix.target.service }}:${{ matrix.target.environment }})'
    needs: resolve
    if: |
      needs.resolve.outputs.has-targets == 'true' &&
      contains(needs.resolve.outputs.targets, '"stack":"terragrunt"')
    strategy:
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets) }}
      fail-fast: false
    uses: ./.github/workflows/reusable--terragrunt-executor.yaml
    with:
      service-name: ${{ matrix.target.service }}
      environment: ${{ matrix.target.environment }}
      action-type: ${{ matrix.target.stack == 'terragrunt' && (github.event_name == 'pull_request' && 'plan' || 'apply') || '' }}
      iam-role: ${{ github.event_name == 'pull_request' && matrix.target.iam_role_plan || matrix.target.iam_role_apply }}
      aws-region: ${{ matrix.target.aws_region }}
      working-directory: ${{ matrix.target.working_directory }}
      app-id: ${{ vars.APP_ID }}
    secrets:
      private-key: ${{ secrets.APP_PRIVATE_KEY }}

  deploy-container:
    name: 'Deploy Container (${{ matrix.target.service }})'
    needs: resolve
    if: |
      needs.resolve.outputs.has-targets == 'true' &&
      contains(needs.resolve.outputs.targets, '"stack":"container"')
    strategy:
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets) }}
      fail-fast: false
    concurrency:
      group: image-build-${{ matrix.target.stack_id }}-${{ matrix.target.service }}-${{ github.sha }}
      cancel-in-progress: false
    uses: ./.github/workflows/reusable--container-builder.yaml
    with:
      image-name: ${{ matrix.target.stack == 'container' && matrix.target.service || '' }}
      working-directory: ${{ matrix.target.working_directory }}
      app-id: ${{ vars.APP_ID }}
    secrets:
      private-key: ${{ secrets.APP_PRIVATE_KEY }}

  deploy-kubernetes:
    name: 'Deploy Kubernetes (${{ matrix.target.service }}:${{ matrix.target.environment }})'
    needs: resolve
    if: |
      github.event_name == 'pull_request' &&
      needs.resolve.outputs.has-targets == 'true' &&
      contains(needs.resolve.outputs.targets, '"stack":"kubernetes"')
    strategy:
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets) }}
      fail-fast: false
    uses: ./.github/workflows/reusable--kubernetes-builder.yaml
    with:
      service-name: ${{ matrix.target.service }}
      environment: ${{ matrix.target.environment }}
      path: ${{ matrix.target.stack == 'kubernetes' && matrix.target.working_directory || '' }}
      app-id: ${{ vars.APP_ID }}
    secrets:
      private-key: ${{ secrets.APP_PRIVATE_KEY }}

  deployment-summary:
    name: 'Deployment Summary'
    needs: [resolve, deploy-terragrunt, deploy-container, deploy-kubernetes]
    if: always() && needs.resolve.outputs.has-targets == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "📊 Deployment Summary"
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Environment: ${{ needs.resolve.outputs.target-environment }}"
          echo "Safety Status: ${{ needs.resolve.outputs.safety-status }}"
          echo "Targets: ${{ needs.resolve.outputs.targets }}"
          echo "Terragrunt Job Status: ${{ needs.deploy-terragrunt.result }}"
          echo "Container Job Status: ${{ needs.deploy-container.result }}"
          echo "Kubernetes Job Status: ${{ needs.deploy-kubernetes.result }}"
          echo "Cleanup Job Status: ${{ needs.cleanup-container.result }}"
