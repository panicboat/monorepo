name: 'Auto Release - Trigger'

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re-)build (e.g. monolith-v0.1.0)'
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: auto-release-trigger-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  detect-component:
    runs-on: ubuntu-latest
    outputs:
      service: ${{ steps.parse.outputs.service }}
      version: ${{ steps.parse.outputs.version }}
      working-directory: ${{ steps.resolve-dir.outputs.working-directory }}
    steps:
      - name: Parse tag
        id: parse
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^([a-z-]+)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' does not match expected pattern <service>-v<X.Y.Z>"
            exit 1
          fi
          SERVICE="${BASH_REMATCH[1]}"
          VERSION="v${BASH_REMATCH[2]}"
          echo "service=$SERVICE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve working directory
        id: resolve-dir
        env:
          SERVICE: ${{ steps.parse.outputs.service }}
        run: |
          set -euo pipefail
          # .github/release-please-config.json packages are the source of truth for
          # component-to-path mapping, which release-please itself uses for tag and
          # release-name generation. This avoids directory probing; mikefarah/yq
          # lacks jq's --arg, so it reads the environment variable via env(NAME).
          path=$(yq -r \
            '.packages | to_entries[] | select(.value.component == env(SERVICE)) | .key' \
            .github/release-please-config.json)
          if [ -z "$path" ]; then
            echo "::error::No release-please package found with component '$SERVICE'"
            exit 1
          fi
          echo "working-directory=$path" >> "$GITHUB_OUTPUT"

  container-build:
    needs: detect-component
    concurrency:
      group: image-build-${{ needs.detect-component.outputs.service }}-${{ github.sha }}
      cancel-in-progress: false
    uses: ./.github/workflows/reusable--container-builder.yaml
    with:
      image-name: ${{ needs.detect-component.outputs.service }}
      working-directory: ${{ needs.detect-component.outputs.working-directory }}
      app-id: ${{ vars.APP_ID }}
      semver-tag: ${{ needs.detect-component.outputs.version }}
    secrets:
      private-key: ${{ secrets.APP_PRIVATE_KEY }}

  resolve-infra-targets:
    name: 'Resolve Production Infra Targets'
    needs: detect-component
    runs-on: ubuntu-latest
    # workflow_dispatch is the existing escape hatch for rebuilding a component
    # image; it must not also trigger a production terragrunt apply.
    if: github.event_name == 'release'
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
      has-targets: ${{ steps.resolve.outputs.has-targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve
        id: resolve
        env:
          SERVICE: ${{ needs.detect-component.outputs.service }}
          ROOT: ${{ needs.detect-component.outputs.working-directory }}
        run: |
          set -euo pipefail
          aws_region=$(yq '.environments[] | select(.environment == "production") | .stacks.terragrunt.aws_region' workflow-config.yaml)
          iam_role_apply=$(yq '.environments[] | select(.environment == "production") | .stacks.terragrunt.iam_role_apply' workflow-config.yaml)

          # Convert ROOT's service-name suffix (for example, "dystopia/monolith")
          # back to the template form used by stack_conventions.root.
          root_pattern="${ROOT%"$SERVICE"}{service}"

          # A missing matching root means ROOT/SERVICE derivation is broken. Entering
          # the loop without a match would silently turn that bug into the normal
          # has-targets=false case for a component without terragrunt stacks.
          matched_root=$(ROOT_PATTERN="$root_pattern" yq -o=json -I=0 \
            '.stack_conventions[] | select(.root == env(ROOT_PATTERN))' workflow-config.yaml)
          if [ -z "$matched_root" ]; then
            echo "::error::No stack_conventions entry found for root pattern '$root_pattern' (derived from working-directory '$ROOT' and service '$SERVICE')"
            exit 1
          fi

          # Consume one compact JSON object per line. TSV plus bash read treats tabs
          # as IFS whitespace, collapsing an empty stack id and shifting fields; this
          # occurred in a system-components terragrunt stack.
          targets='[]'
          while IFS= read -r stack_json; do
            stack_name=$(echo "$stack_json" | jq -r '.name')
            [ "$stack_name" = "terragrunt" ] || continue
            stack_id=$(echo "$stack_json" | jq -r '.id // "terragrunt"')
            directory=$(echo "$stack_json" | jq -r '.directory')
            dir="${directory//\{environment\}/production}"
            full_dir="${ROOT}/${dir}"
            [ -d "$full_dir" ] || continue
            targets=$(echo "$targets" | jq -c \
              --arg service "$SERVICE" \
              --arg stack_id "$stack_id" \
              --arg dir "$full_dir" \
              --arg region "$aws_region" \
              --arg role "$iam_role_apply" \
              '. + [{"service":$service,"stack_id":$stack_id,"working_directory":$dir,"aws_region":$region,"iam_role_apply":$role}]')
          done < <(ROOT_PATTERN="$root_pattern" yq -o=json -I=0 '
            .stack_conventions[] | select(.root == env(ROOT_PATTERN)) | .stacks[]
          ' workflow-config.yaml)

          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          if [ "$(echo "$targets" | jq 'length')" -gt 0 ]; then
            echo "has-targets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-targets=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-infra:
    name: 'Deploy Infra (${{ matrix.target.service }}:${{ matrix.target.stack_id }})'
    needs: resolve-infra-targets
    if: needs.resolve-infra-targets.outputs.has-targets == 'true'
    strategy:
      matrix:
        target: ${{ fromJson(needs.resolve-infra-targets.outputs.targets) }}
      fail-fast: false
    uses: ./.github/workflows/reusable--terragrunt-executor.yaml
    with:
      service-name: ${{ matrix.target.service }}
      environment: production
      action-type: apply
      iam-role: ${{ matrix.target.iam_role_apply }}
      aws-region: ${{ matrix.target.aws_region }}
      working-directory: ${{ matrix.target.working_directory }}
      app-id: ${{ vars.APP_ID }}
    secrets:
      private-key: ${{ secrets.APP_PRIVATE_KEY }}
