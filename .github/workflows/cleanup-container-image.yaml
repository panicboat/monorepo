# Deletes stale pr- and sha- tags and untagged images of the service containers in ghcr.io every day.
name: 'Cleanup Container Images'

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    permissions:
      contents: read
      packages: write
    uses: panicboat/.github/.github/workflows/reusable--cleanup-container-image.yaml@5cdc9877edabfc6f69bf8c8a339ac8f2f57a7cc3 # v0.3.4
    with:
      services: '["monolith","frontend","pennyworth"]'
