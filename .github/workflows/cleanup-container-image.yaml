# Deletes stale pr- and sha- tags and untagged images of the service containers in ghcr.io every day.
name: 'Cleanup Container Images'

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    permissions:
      contents: read
      packages: write
    uses: panicboat/.github/.github/workflows/reusable--cleanup-container-image.yaml@813235b879c17711be263e1d4ff22dfaec6d8dbc # v3.2.0
    with:
      services: '["monolith","frontend","pennyworth"]'
