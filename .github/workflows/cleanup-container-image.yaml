# Deletes stale pr- and sha- tags and untagged images of the service containers in ghcr.io every day.
name: 'Cleanup Container Images'

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    permissions:
      contents: read
      packages: write
    uses: panicboat/.github/.github/workflows/reusable--cleanup-container-image.yaml@8b7584f3294fd588e49f7f652cfb1b09a3aa6611 # v0.3.3
    with:
      services: '["monolith","frontend","pennyworth"]'
