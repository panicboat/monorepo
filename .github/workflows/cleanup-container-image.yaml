# Deletes stale pr- and sha- tags and untagged images of the service containers in ghcr.io every day.
name: 'Cleanup Container Images'

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    permissions:
      contents: read
      packages: write
    uses: panicboat/.github/.github/workflows/reusable--cleanup-container-image.yaml@cf98ce094f5e91cfc9072b5e401d9ed371bf0719 # v3.0.0
    with:
      services: '["monolith","frontend","pennyworth"]'
