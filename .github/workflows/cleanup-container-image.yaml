# Deletes stale pr- and sha- tags and untagged images of the service containers in ghcr.io every day.
name: 'Cleanup Container Images'

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    permissions:
      contents: read
      packages: write
    uses: panicboat/.github/.github/workflows/reusable--cleanup-container-image.yaml@8ec6f461b570e0d12ae2f3cc2d2e39569b1c4c55 # v3.1.0
    with:
      services: '["monolith","frontend","pennyworth"]'
