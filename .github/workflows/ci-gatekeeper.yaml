# Waits for every other workflow on a pull request so that one required check gates the merge.
name: 'CI Gatekeeper'

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - '**'

jobs:
  ci-gatekeeper:
    permissions:
      actions: read
    uses: panicboat/.github/.github/workflows/reusable--ci-gatekeeper.yaml@d54532665675f1843914da4b324dc2a58dd37239 # v1.0.0
    with:
      # A failed judge would keep the Gatekeeper red even after the approval label, so the verdict lives in its own commit status.
      exclude-workflow-names: Docs Sync Check
