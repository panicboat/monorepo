# Builds the container image of a published service release or a dispatched tag and tags it with the release version.
name: 'Release - Build'

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re-)build (e.g. monolith-v0.1.0)'
        required: true
        type: string

concurrency:
  group: release-build-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release-build:
    permissions:
      contents: read
      packages: write
    uses: panicboat/.github/.github/workflows/reusable--release--build.yaml@c7e840647bcbae967cde37c6d32d39e70029f722 # v0.3.0
    with:
      app-id: ${{ vars.APP_ID }}
    secrets:
      private-key: ${{ secrets.APP_PRIVATE_KEY }}
