name: 'Dystopia Frontend Test'

on:
  pull_request:
    paths:
      - 'dystopia/frontend/**'
      - '.github/workflows/dystopia-frontend-test.yaml'

permissions: {}

concurrency:
  group: dystopia-frontend-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  vitest:
    name: 'Vitest'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: dystopia/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: dystopia/frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run vitest
        run: pnpm test
