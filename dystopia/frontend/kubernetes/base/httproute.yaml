apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
# Omit namespace fields so Flux targetNamespace and same-namespace Service resolution avoid a ReferenceGrant.
metadata:
  name: frontend
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: default
  hostnames:
    - dystopia.city
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
