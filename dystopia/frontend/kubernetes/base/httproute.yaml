# Cilium Gateway (= namespace default、 listener http:8080) を parentRef、
# host dystopia.city (apex) への traffic を frontend Service:80 に backend
# する。 ingress 経路: client → ALB (= application IngressGroup、 platform 側
# kubernetes/components/cilium/) → cilium-envoy hostNetwork :8080 → 本
# HTTPRoute → frontend。
#
# metadata.namespace / backendRefs[].namespace は指定しない。 前者は Flux
# Kustomization.spec.targetNamespace (= dystopia) が inject、 後者は同一
# namespace 参照 (= dystopia/frontend Service) にして cross-namespace 参照の
# ReferenceGrant 要件を回避する。 parentRefs は Gateway が存在する default
# を明示する必要があるので残す。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: default
  hostnames:
    - dystopia.city
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
