apiVersion: apps/v1
kind: Deployment
metadata:
  name: monolith
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: monolith
  template:
    metadata:
      labels:
        app: monolith
    spec:
      serviceAccountName: monolith
      containers:
        - name: monolith
          image: ghcr.io/panicboat/monorepo/monolith:latest
          imagePullPolicy: IfNotPresent
          command: ["./bin/start"]
          ports:
            - containerPort: 9001
          # OTel の resource attributes は downward API の値を $() 展開して組み立てる。
          # envFrom 経由の値は $() 展開されないため env: に置く。
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_SERVICE_NAME
              value: monolith
            # Ruby の opentelemetry-exporter-otlp は OTLP/HTTP のみで、 collector の
            # otlp-http port を指す。 この env の有無が lib/telemetry.rb の計装 on/off。
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://opentelemetry-collector.monitoring.svc.cluster.local:4318
            # k8s.* は Application Monitoring dashboard の TraceQL が
            # resource.k8s.namespace.name で絞り込むために必要。
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.node.name=$(NODE_NAME),k8s.deployment.name=monolith
          envFrom:
            - configMapRef:
                name: monolith
            - secretRef:
                name: monolith-database
            - secretRef:
                name: monolith-billing
