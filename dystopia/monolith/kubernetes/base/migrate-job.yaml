apiVersion: batch/v1
kind: Job
metadata:
  name: monolith-migrate
  labels:
    app: monolith
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: monolith-migrate
    spec:
      restartPolicy: Never
      serviceAccountName: monolith
      containers:
        - name: migrate
          image: ghcr.io/panicboat/monorepo/monolith:latest
          imagePullPolicy: IfNotPresent
          command: ["bundle", "exec", "hanami", "db", "migrate", "--no-dump"]
          envFrom:
            - configMapRef:
                name: monolith
            - secretRef:
                name: monolith-database
