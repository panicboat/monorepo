apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: monolith-billing
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: monolith-billing
    creationPolicy: Owner
  data:
    - secretKey: STRIPE_API_KEY
      remoteRef:
        key: dystopia/monolith/billing
        property: stripe_api_key
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: dystopia/monolith/billing
        property: stripe_webhook_secret
    - secretKey: STRIPE_PRICE_ID_GUEST
      remoteRef:
        key: dystopia/monolith/billing
        property: stripe_price_id_guest
    - secretKey: STRIPE_PRICE_ID_CAST
      remoteRef:
        key: dystopia/monolith/billing
        property: stripe_price_id_cast
    - secretKey: BILLING_SUCCESS_URL
      remoteRef:
        key: dystopia/monolith/billing
        property: billing_success_url
    - secretKey: BILLING_CANCEL_URL
      remoteRef:
        key: dystopia/monolith/billing
        property: billing_cancel_url
    - secretKey: BILLING_PORTAL_RETURN_URL
      remoteRef:
        key: dystopia/monolith/billing
        property: billing_portal_return_url
