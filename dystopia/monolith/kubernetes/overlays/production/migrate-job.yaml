# =============================================================================
# Job patch for monolith-migrate (production overlay)
# =============================================================================
# 同じ $imagepolicy マーカーを付けることで、Flux ImageUpdateAutomation が
# deployment.yaml と同じ commit でこの image 行も書き換える。
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: monolith-migrate
spec:
  template:
    spec:
      containers:
        - name: migrate
          image: ghcr.io/panicboat/monorepo/monolith:v0.7.0 # {"$imagepolicy": "flux-system:monolith"}
