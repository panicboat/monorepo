# Same $imagepolicy marker as deployment.yaml so Flux updates both in one commit.
apiVersion: batch/v1
kind: Job
metadata:
  name: monolith-migrate
spec:
  template:
    spec:
      containers:
        - name: migrate
          image: ghcr.io/panicboat/monorepo/monolith:v0.7.0 # {"$imagepolicy": "flux-system:monolith"}
