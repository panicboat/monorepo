apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: meeting-translation
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: default
  hostnames:
    - dystopia.city
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /translate
      backendRefs:
        - name: meeting-translation
          port: 80
