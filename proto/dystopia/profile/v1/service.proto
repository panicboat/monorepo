syntax = "proto3";

package profile.v1;

service ProfileService {
  rpc GetProfile (GetProfileRequest) returns (GetProfileResponse);
  rpc GetProfileByUsername (GetProfileByUsernameRequest) returns (GetProfileResponse);
  rpc ListMyProfiles (ListMyProfilesRequest) returns (ListMyProfilesResponse);
  rpc CreateProfile (CreateProfileRequest) returns (CreateProfileResponse);
  rpc SaveProfile (SaveProfileRequest) returns (SaveProfileResponse);
  rpc CheckUsernameAvailability (CheckUsernameAvailabilityRequest) returns (CheckUsernameAvailabilityResponse);
  rpc SaveProfileMedia (SaveProfileMediaRequest) returns (SaveProfileMediaResponse);
}

message Profile {
  string id = 1;
  string username = 2;
  string display_name = 3;
  string bio = 4;
  string avatar_media_id = 5;
  string avatar_url = 6;
  string cover_media_id = 7;
  string cover_url = 8;
  string website = 9;
  SnsLinks sns_links = 10;
  string prefecture = 11;
  bool is_private = 12;
  string registered_at = 13;

  int32 age = 14;
  BodyStats body_stats = 15;
  string industry = 17;

  int32 role = 20;
  bool disabled = 21;
}

message SnsLinks {
  string x = 1;
  string instagram = 2;
  string tiktok = 3;
  string bluesky = 4;
  string line = 5;
  string cityheaven = 6;
}

message BodyStats {
  int32 height_cm = 1;
  int32 bust_cm = 2;
  int32 waist_cm = 3;
  int32 hip_cm = 4;
  string cup = 5;
}

message GetProfileRequest { string profile_id = 1; }
message GetProfileByUsernameRequest { string username = 1; }
message GetProfileResponse { Profile profile = 1; }

message ListMyProfilesRequest {}
message ListMyProfilesResponse { repeated Profile profiles = 1; }

message CreateProfileRequest {
  string display_name = 1;
  string username = 2;
}
message CreateProfileResponse { Profile profile = 1; }

message SaveProfileRequest {
  string username = 1;
  string display_name = 2;
  string bio = 3;
  string website = 4;
  SnsLinks sns_links = 5;
  string prefecture = 6;
  bool is_private = 7;
  int32 age = 8;
  BodyStats body_stats = 9;
  string industry = 11;
}
message SaveProfileResponse { Profile profile = 1; }

message CheckUsernameAvailabilityRequest { string username = 1; }
message CheckUsernameAvailabilityResponse {
  bool available = 1;
  string message = 2;
}

message SaveProfileMediaRequest {
  string avatar_media_id = 1;
  string cover_media_id = 2;
}
message SaveProfileMediaResponse { Profile profile = 1; }
