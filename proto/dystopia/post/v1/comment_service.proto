syntax = "proto3";

package post.v1;

import "post/v1/post_service.proto";

service CommentService {
  rpc AddComment(AddCommentRequest) returns (AddCommentResponse);
  rpc DeleteComment(DeleteCommentRequest) returns (DeleteCommentResponse);
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);
  rpc ListReplies(ListRepliesRequest) returns (ListRepliesResponse);
  rpc ListCommentsByAuthor(ListCommentsByAuthorRequest) returns (ListCommentsByAuthorResponse);
}

message CommentMedia {
  string id = 1;
  string media_type = 2;
  string url = 3;
  string thumbnail_url = 4;
  string media_id = 5;
}

message CommentAuthor {
  string profile_id = 1;
  string name = 2;
  string image_url = 3;
  string user_type = 4;
  string username = 5;
}

message Comment {
  string id = 1;
  string post_id = 2;
  string parent_id = 3;
  string author_profile_id = 4;
  string content = 5;
  string created_at = 6;
  CommentAuthor author = 7;
  repeated CommentMedia media = 8;
  int32 replies_count = 9;
  repeated PostMention mentions = 10;
}

message AddCommentRequest {
  string post_id = 1;
  string content = 2;
  string parent_id = 3;
  repeated CommentMedia media = 4;
}

message AddCommentResponse {
  Comment comment = 1;
  int32 comments_count = 2;
}

message DeleteCommentRequest {
  string comment_id = 1;
}

message DeleteCommentResponse {
  int32 comments_count = 1;
}

message ListCommentsRequest {
  string post_id = 1;
  int32 limit = 2;
  string cursor = 3;
}

message ListCommentsResponse {
  repeated Comment comments = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message ListRepliesRequest {
  string comment_id = 1;
  int32 limit = 2;
  string cursor = 3;
}

message ListRepliesResponse {
  repeated Comment replies = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message ListCommentsByAuthorRequest {
  string author_profile_id = 1;
  int32 limit = 2;
  string cursor = 3;
}

message ListCommentsByAuthorResponse {
  repeated Comment comments = 1;
  string next_cursor = 2;
  bool has_more = 3;
  map<string, post.v1.Post> posts_by_id = 4;
}
