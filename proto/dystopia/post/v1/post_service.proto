syntax = "proto3";

package post.v1;

import "profile/v1/service.proto";
import "schedule/v1/schedule_service.proto";

service PostService {
  rpc ListPosts(ListPostsRequest) returns (ListPostsResponse);
  rpc GetPost(GetPostRequest) returns (GetPostResponse);
  rpc SavePost(SavePostRequest) returns (SavePostResponse);
}

message PostMention {
  string profile_id = 1;
  string username = 2;
  int32 position = 3;
  int32 length = 4;
}

message PostMedia {
  string id = 1;
  string media_type = 2;
  string url = 3;
  string thumbnail_url = 4;
  string media_id = 5;
}

message Post {
  string id = 1;
  string author_profile_id = 2;
  string content = 3;
  repeated PostMedia media = 4;
  string created_at = 5;
  profile.v1.ProfileSummary author = 6;
  int32 likes_count = 7;
  int32 comments_count = 8;
  string visibility = 9;
  repeated string hashtags = 10;
  bool liked = 11;
  repeated PostMention mentions = 12;
  string published_at = 13;
  string expires_at = 14;
  schedule.v1.Schedule schedule = 15;
}

message ListPostsRequest {
  int32 limit = 1;
  string cursor = 2;
  string author_profile_id = 3;
  string filter = 4;
  bool media_only = 5;
}

message ListPostsResponse {
  repeated Post posts = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message SavePostRequest {
  string id = 1;
  string content = 2;
  repeated PostMedia media = 3;
  string visibility = 4;
  repeated string hashtags = 5;
  string published_at = 6;
  string expires_at = 7;
}

message SavePostResponse {
  Post post = 1;
}

message GetPostRequest {
  string id = 1;
}

message GetPostResponse {
  Post post = 1;
}
