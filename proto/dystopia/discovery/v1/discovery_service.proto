syntax = "proto3";

package discovery.v1;

import "profile/v1/service.proto";
import "post/v1/post_service.proto";
import "schedule/v1/schedule_service.proto";

service DiscoveryService {
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse);
  rpc SearchPosts(SearchPostsRequest) returns (SearchPostsResponse);
  rpc RankPosts(RankPostsRequest) returns (RankPostsResponse);
  rpc SuggestUsers(SuggestUsersRequest) returns (SuggestUsersResponse);
  rpc SearchSchedules(SearchSchedulesRequest) returns (SearchSchedulesResponse);
}

enum RankPeriod {
  RANK_PERIOD_UNSPECIFIED = 0;
  RANK_PERIOD_DAY = 1;
  RANK_PERIOD_WEEK = 2;
  RANK_PERIOD_ALL = 3;
}

message SearchUsersRequest {
  string query = 1;
  int32 limit = 2;
  string cursor = 3;
  int32 role_filter = 4;
}

message SearchUsersResponse {
  repeated profile.v1.ProfileSummary profiles = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message SearchPostsRequest {
  string query = 1;
  int32 limit = 2;
  string cursor = 3;
}

message SearchPostsResponse {
  repeated post.v1.Post posts = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message RankPostsRequest {
  RankPeriod period = 1;
  int32 limit = 2;
  string cursor = 3;
}

message RankPostsResponse {
  repeated post.v1.Post posts = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message SuggestUsersRequest {
  int32 limit = 1;
  string cursor = 2;
}

message SuggestUsersResponse {
  repeated profile.v1.ProfileSummary profiles = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message SearchSchedulesRequest {
  string work_date = 1;
  string prefecture = 2;
  string time_band = 3;
  bool following_only = 4;
  string query = 5;
  int32 limit = 6;
  string cursor = 7;
  string area = 8;
  string industry = 9;
}

message ScheduleSearchResult {
  schedule.v1.Schedule schedule = 1;
  profile.v1.ProfileSummary profile = 2;
  string prefecture = 3;
  string note = 4;
  string area = 5;
}

message SearchSchedulesResponse {
  repeated ScheduleSearchResult results = 1;
  string next_cursor = 2;
  bool has_more = 3;
}
