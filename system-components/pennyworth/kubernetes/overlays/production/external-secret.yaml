apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pennyworth-slack
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: pennyworth-slack
    creationPolicy: Owner
  data:
    - secretKey: SLACK_SIGNING_SECRET
      remoteRef:
        key: eks/holmesgpt/slack
        property: signing_secret
    - secretKey: SLACK_BOT_TOKEN
      remoteRef:
        key: eks/holmesgpt/slack
        property: bot_token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pennyworth-alertmanager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: pennyworth-alertmanager
    creationPolicy: Owner
  data:
    - secretKey: ALERTMANAGER_SHARED_TOKEN
      remoteRef:
        key: eks/holmesgpt/alertmanager
        property: shared_token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pennyworth-github
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: pennyworth-github
    creationPolicy: Owner
  data:
    - secretKey: GITHUB_APP_ID
      remoteRef:
        key: github-app/holmes-bot
        property: app_id
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef:
        key: github-app/holmes-bot
        property: private_key
    - secretKey: GITHUB_APP_INSTALLATION_ID
      remoteRef:
        key: github-app/holmes-bot
        property: installation_id
