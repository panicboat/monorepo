apiVersion: networking.k8s.io/v1
kind: Ingress
# Keep webhook routes unauthenticated because Slack and Alertmanager authenticate the requests themselves.
metadata:
  name: pennyworth
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/group.name: application
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    external-dns.alpha.kubernetes.io/hostname: pennyworth.panicboat.net
spec:
  ingressClassName: alb
  rules:
    - host: pennyworth.panicboat.net
      http:
        paths:
          - path: /slack
            pathType: Prefix
            backend:
              service:
                name: pennyworth-slack
                port:
                  number: 80
          - path: /alertmanager
            pathType: Prefix
            backend:
              service:
                name: pennyworth-alertmanager
                port:
                  number: 80
