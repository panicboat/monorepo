apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: holmes-slack
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: holmes-slack
    creationPolicy: Owner
  data:
    - secretKey: SLACK_SIGNING_SECRET
      remoteRef:
        key: panicboat/holmes/slack
        property: signing_secret
    - secretKey: SLACK_BOT_TOKEN
      remoteRef:
        key: panicboat/holmes/slack
        property: bot_token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: holmes-alertmanager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: holmes-alertmanager
    creationPolicy: Owner
  data:
    - secretKey: ALERTMANAGER_SHARED_TOKEN
      remoteRef:
        key: panicboat/holmes/alertmanager
        property: shared_token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: holmes-github
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: holmes-github
    creationPolicy: Owner
  data:
    - secretKey: GITHUB_APP_ID
      remoteRef:
        key: panicboat/holmes/github
        property: app_id
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef:
        key: panicboat/holmes/github
        property: private_key
    - secretKey: GITHUB_APP_INSTALLATION_ID
      remoteRef:
        key: panicboat/holmes/github
        property: installation_id
